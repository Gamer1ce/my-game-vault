<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fcee0a"><meta name="robots" content="noindex,nofollow">
  <title>个人视频 · 中枢圣殿</title>
  <link rel="icon" href="/icons/favicon-32-v3.png">
  <link rel="stylesheet" href="/my-videos.css?v=20260925-1">
  <link rel="stylesheet" href="/private-upload.css?v=20260924-1">
  <script type="module" src="/my-videos.js?v=20260926-2"></script>
</head>
<body>
  <header><a href="/" class="brand">SANCTUARY//NEXUS <span>中枢圣殿</span></a><nav aria-label="个人空间"><a href="/">返回主站</a><button id="logout" type="button">退出登录</button></nav></header>
  <main>
    <div class="library-heading"><div><p class="eyebrow">PERSONAL ARCHIVE</p><h1 id="owner">个人视频</h1><p id="summary">正在读取你的片库…</p></div><button id="refresh" type="button">刷新片库</button></div>
    <section id="uploadPanel" class="upload-panel" aria-label="上传私人视频" hidden>
      <label class="upload-select">上传视频<input id="uploadFile" type="file" accept=".mp4,.mov,.m4v,.webm"></label>
      <span class="upload-hint">仅保存至你的硬盘 · 单个最大 8 GiB</span>
      <button type="button" data-upload-toggle hidden>暂停上传</button><button type="button" data-upload-cancel hidden>取消上传</button>
      <progress value="0" max="1" aria-label="上传进度" hidden></progress><p role="status" aria-live="polite"></p>
    </section>
    <div class="filters"><label for="search">查找视频<input id="search" type="search" placeholder="搜索游戏、文件夹或视频名称" autocomplete="off"></label><label for="folder">文件夹<select id="folder"><option value="">全部文件夹</option></select></label></div>
    <p id="message" role="status" aria-live="polite"></p>
    <section id="gallery" class="gallery" aria-label="我的视频"></section>
    <div class="more-actions"><button id="more" type="button" hidden>显示更多</button><button id="collapse" type="button" hidden>折叠</button></div>
  </main>
  <dialog id="playerDialog" aria-labelledby="videoTitle"><div class="player-heading"><h2 id="videoTitle"></h2><button id="closePlayer" type="button" aria-label="关闭视频">×</button></div><video id="video" controls playsinline preload="metadata"></video><p id="playerMessage" role="status"></p></dialog>
</body>
</html>
