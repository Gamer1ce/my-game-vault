name: game-time-vault

services:
  game-vault:
    build:
      context: .
    image: gamer1ce/game-time-vault:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GAME_VAULT_PORT:-4173}:4173"
    environment:
      PORT: "4173"
      DATA_DIR: /data
      HIGHLIGHTS_DIR: /media/highlights
      PRIVATE_HIGHLIGHTS_DIR: /media/private-dai
      PUBLIC_MEDIA_LOCAL_ONLY: "1"
      AZURE_RETIRED: "1"
      PUBLIC_MODE: "1"
      TRUST_PROXY: "1"
      PLATFORM_SYNC_ENABLED: "${PLATFORM_SYNC_ENABLED:-1}"
      HTTP_PROXY: "${GAME_VAULT_HTTP_PROXY:-http://host.docker.internal:7897}"
      HTTPS_PROXY: "${GAME_VAULT_HTTPS_PROXY:-http://host.docker.internal:7897}"
      NO_PROXY: "127.0.0.1,localhost,game-vault,192.168.0.0/16,10.0.0.0/8"
      AZURE_BACKUP_PROJECT_DIR: /app
      AZURE_BACKUP_KEY_PATH: /run/secrets/azure-key.pem
      AZURE_BACKUP_MEDIA_DIR: /media/highlights
      AZURE_BACKUP_DEPLOYMENT_MODE: docker
      AZURE_BACKUP_SYNC_ENABLED: "0"
      AZURE_BACKUP_SYNC_COMMAND: /app/scripts/sync-azure-backup.zsh
      AZURE_SYNC_REQUEST_POLL_ENABLED: "0"
      AZURE_SYNC_REQUEST_POLL_COMMAND: /app/scripts/poll-azure-sync-request.zsh
      AZURE_SYNC_REQUEST_STATE_DIR: /data/runtime
      GAME_VAULT_ADMIN_FILE: /data/admin-access.json
      GAME_VAULT_LOCAL_ORIGIN: http://127.0.0.1:4173
      MINECRAFT_STATUS_HOST: host.docker.internal
      MINECRAFT_STATUS_PORT: "47060"
      MINECRAFT_METRICS_FILE: /minecraft-status/status.json
      MINECRAFT_PACK_NAME: "香草纪元：食旅纪行"
      MINECRAFT_PACK_VERSION: "2.7.1"
      MINECRAFT_PUBLIC_ADDRESS: "[240e:331:2279:c410:495:6182:febf:b47e]:47060"
    volumes:
      - type: bind
        source: "${GAME_VAULT_DATA_DIR:-./data}"
        target: /data
      - type: bind
        source: "${GAME_VAULT_MEDIA_DIR:-/Volumes/游戏视频（韩冰屹）}"
        target: /media/highlights
        read_only: true
      - type: bind
        source: "${GAME_VAULT_PRIVATE_MEDIA_DIR:-/Volumes/游戏视频（戴卓然）}"
        target: /media/private-dai
        read_only: true
      - type: bind
        source: "${MINECRAFT_METRICS_DIR:-/Users/gamer1ce/.local/share/game-vault-minecraft}"
        target: /minecraft-status
        read_only: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
